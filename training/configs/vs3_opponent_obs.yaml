# SMDP-PPO VS self-play with opponent-board observability (vs3 lineage).
#
# Cloned from vs_selfplay.yaml with the opponent-obs gate enabled
# (docs/VS_OPPONENT_OBS.md): 20-channel obs (opponent bottle at ch 8..15),
# aux v1_vs, warm-started from the round-robin-verified VS champion
# (vs2-530m, +94.9 Elo in vs_lineage_rr_2026-06-12) expanded with
# tools/expand_checkpoint (zero-init slices: identical outputs at init).

algo: ppo_smdp

train:
  total_steps: 2000000000
  checkpoint_interval: 5000000
  init_checkpoint: /Users/ethan/dev/drmario/drmc-rl/runs/best_agents/vs_champion_530m_oppobs.pt.gz
  strict_checkpoint: true
  resume_step: false
  resume_optimizer: false

smdp_ppo:
  lr: 7.0e-5
  gamma: 1.0
  gae_lambda: 0.98

  clip_epsilon: 0.15
  value_coef: 0.5
  entropy_coef: 0.008
  max_grad_norm: 0.7

  decisions_per_update: 4096
  num_epochs: 2
  minibatch_size: 512

  policy_type: "candidate"
  head_type: "dense"
  pill_embed_dim: 128
  pill_embed_type: "ordered_pair"
  encoder_blocks: 4

  candidate_max_candidates: 128
  candidate_d_model: 192
  candidate_pos_embed_dim: 32
  candidate_cost_embed_dim: 32
  candidate_hidden_dim: 384
  candidate_board_encoder: "cnn"
  candidate_board_channels: 16
  candidate_transformer_layers: 4
  candidate_transformer_heads: 4
  candidate_transformer_ff_mult: 4
  candidate_patch_kernel: 9

  aux_spec: "v1_vs"

  # Search-amplified training targets (Gumbel-AZ-lite, OFF by default;
  # docs/SEARCH_DISTILL.md). Compatible with this opponent-obs stack: the
  # search sims run the learner's own board on the 1P pool; the opponent
  # planes (obs ch 8..15) and the v1_vs aux tail are frozen at the searched
  # decision and spliced into every node evaluation (exact at ply 1,
  # frozen-opponent approximation at ply 2). Searched envs are batched per
  # vectorized decision.
  # search_distill:
  #   enabled: false
  #   sims: 12               # native sim envs per searched decision
  #   beam: 8                # ply-1 beam width
  #   decision_fraction: 0.25
  #   beta: 1.0              # KL term weight
  #   value_mix: 0.5         # blend of search Q into value targets (0 = off)
  #   sigma_scale: 1.0       # c in improved_logits = prior + c * norm(Q)
  #   opponent_model: none   # none|self — self advances the opponent board
  #                          # one self-model placement (argmax of these same
  #                          # weights on the opponent's mirrored obs) for the
  #                          # ply-2 leaf contexts; O(1) extra sims/search
  #   act_from_search: false # execute improved-policy samples at searched
  #                          # decisions (behavior log-prob from the improved
  #                          # distribution; shifts toward full Gumbel-AZ)

  entropy_schedule_end: 0.008
  entropy_schedule_steps: 100000000
  use_gumbel_topk: false
  gumbel_k: 2

  value_loss_type: "huber"

env:
  id: "drmario-vs"
  obs_mode: state
  backend: cpp-vs-pool
  state_repr: bitplane_bottle_conn_mask_vs
  num_pairs: 16
  frame_stack: 1
  randomize_rng: true
  level: 14
  speed_setting: 2
  opponent_pool:
    enabled: true
    max_pool: 12
    snapshot_every_matches: 400
    # League roles (docs/LEAGUE.md). Default mode pfsp = today's behavior.
    # league:
    #   mode: mixed              # pfsp | exploiter | mixed
    #   main_agents:             # fixed targets (exploiter/mixed)
    #     - runs/best_agents/vs_champion_smdp_ppo_step530046434.pt.gz
    #   exploiter_fraction: 0.3  # mixed: fraction of matches vs main_agents

curriculum:
  enabled: false

logdir: "runs/vs3_01"
video_interval: 10000
log_interval: 100
