# vs4 "endpoint" run: every architecture-review item enabled at once.
# Launch AFTER vs3 (opponent-obs-only) plateaus, warm-started from the best
# vs3 checkpoint (tournament-verified vs the 530M champion). Sequencing
# rationale: search distillation costs ~3-4x rollout throughput — pay it once
# the cheap opponent-obs gains are banked. docs/ARCHITECTURE_REVIEW_2026-06.md.

algo: ppo_smdp

train:
  total_steps: 2000000000
  checkpoint_interval: 5000000
  # PLACEHOLDER — set to the tournament-verified best vs3 checkpoint.
  init_checkpoint: REPLACE_WITH_BEST_VS3_CKPT
  strict_checkpoint: true
  resume_step: false
  resume_optimizer: false

smdp_ppo:
  lr: 7.0e-5
  gamma: 1.0
  gae_lambda: 0.98

  clip_epsilon: 0.15
  value_coef: 0.5
  entropy_coef: 0.008
  max_grad_norm: 0.7

  decisions_per_update: 4096
  num_epochs: 2
  minibatch_size: 512

  policy_type: "candidate"
  head_type: "dense"
  pill_embed_dim: 128
  pill_embed_type: "ordered_pair"
  encoder_blocks: 4

  candidate_max_candidates: 128
  candidate_d_model: 192
  candidate_pos_embed_dim: 32
  candidate_cost_embed_dim: 32
  candidate_hidden_dim: 384
  candidate_board_encoder: "cnn"
  candidate_board_channels: 16
  candidate_transformer_layers: 4
  candidate_transformer_heads: 4
  candidate_transformer_ff_mult: 4
  candidate_patch_kernel: 9

  aux_spec: "v1_vs"

  entropy_schedule_end: 0.008
  entropy_schedule_steps: 100000000
  use_gumbel_topk: false
  gumbel_k: 2

  value_loss_type: "huber"

  # Gumbel-AZ phase 2 (docs/SEARCH_DISTILL.md): vs-obs search with frozen
  # opponent context, batched across envs, self-model opponent at leaves.
  # decision_fraction 0.1 to start — raise if dec/s headroom allows.
  search_distill:
    enabled: true
    sims: 12
    beam: 8
    decision_fraction: 0.1
    beta: 1.0
    value_mix: 0.5
    sigma_scale: 1.0
    opponent_model: self
    act_from_search: false   # phase-2b: flip after distillation proves stable

env:
  id: "drmario-vs"
  obs_mode: state
  backend: cpp-vs-pool
  state_repr: bitplane_bottle_conn_mask_vs
  num_pairs: 16
  frame_stack: 1
  randomize_rng: true
  level: 14
  speed_setting: 2
  # Clear-win incentive (ablation ladder candidate; see docs/ABLATION_PLAN.md
  # match-ending forensics): +bonus on wins earned by clearing all own
  # viruses. 0.0 = off.
  # clear_win_bonus: 0.25
  # Go-Exploit: a fraction of resets start from real human mid-game positions
  # (docs/HUMAN_CORPUS_INTEGRATION.md).
  start_bank:
    enabled: true
    path: runs/start_bank/start_bank_v1.npz
    fraction: 0.25
  opponent_pool:
    enabled: true
    max_pool: 12
    snapshot_every_matches: 400
    # Style seeds: BC human-band opponents (mark protected in manifest —
    # docs/HUMAN_CORPUS_INTEGRATION.md workaround until a protected_seeds knob
    # exists).
    seed_paths:
      - runs/bc_opponents/bc_lt1600.pt.gz
      - runs/bc_opponents/bc_1600to2000.pt.gz
      - runs/bc_opponents/bc_gt2000.pt.gz
    # League depth (docs/LEAGUE.md): mostly self-history PFSP, 20% of matches
    # vs fixed champions.
    league:
      mode: mixed
      exploiter_fraction: 0.2
      main_agents:
        - runs/best_agents/vs_champion_smdp_ppo_step530046434.pt.gz

curriculum:
  enabled: false

logdir: "runs/vs4_01"
video_interval: 10000
log_interval: 100
