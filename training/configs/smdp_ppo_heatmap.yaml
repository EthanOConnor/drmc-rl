# Heatmap baseline for placement-SMDP experiments.
#
# The forward default is `training/configs/smdp_ppo.yaml` (candidate scoring).
# Keep this file for controlled comparisons against a dense 512-action policy.

algo: ppo_smdp

train:
  total_steps: 500000000
  checkpoint_interval: 100000

smdp_ppo:
  lr: 3.0e-4
  gamma: 0.998
  gae_lambda: 0.95

  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.7

  decisions_per_update: 512
  num_epochs: 4
  minibatch_size: 128

  policy_type: "heatmap"
  head_type: "dense"
  pill_embed_dim: 128
  pill_embed_type: "ordered_pair"
  encoder_blocks: 0
  aux_spec: "v1"

  entropy_schedule_end: 0.005
  entropy_schedule_steps: 100000000
  use_gumbel_topk: false
  gumbel_k: 2
  value_loss_type: "huber"

env:
  id: "DrMarioPlacementEnv-v0"
  obs_mode: state
  backend: cpp-pool
  state_repr: bitplane_bottle_conn_mask
  num_envs: 16
  frame_stack: 1
  randomize_rng: true
  speed_setting: 2

curriculum:
  enabled: true
  mode: ln_hop_back
  start_level: -15
  max_level: 20
  confidence_sigmas: 1.0
  time_budget_mastery_sigmas: 2.0
  pass_ramp_exponent_multiplier: 0.6
  confidence_ema_half_life_episodes: 256.0
  confidence_min_effective_episodes: 128.0
  min_stage_decisions: 512
  probe_threshold: 0.25
  window_episodes: 100
  min_episodes: 50
  rehearsal_prob: 0.1

logdir: "runs/smdp_ppo_heatmap"
video_interval: 10000
log_interval: 100
