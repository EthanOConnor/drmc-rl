# vs4: the "metagame fix" run (rewritten 2026-06-12 after the obs verdict).
#
# Evidence (docs/ABLATION_PLAN.md): self-play converged to attrition-at-the-
# ceiling (0/40 clear-wins), human-style BC nets beat the champion ~90%
# mostly by full clear, and opponent-board obs FAILED its ablation
# (treatment 18% vs control 49% against the champion anchor at ~50M;
# 96-104 head-to-head; reliance probe inverted). So vs4 is 8-channel,
# warm-started from the original 530M champion, and bundles one coherent
# intervention: make clear-to-win learnable and punished-if-ignored.
#   - clear_win_bonus: win-by-clear pays 1.25 vs 1.0 for topout wins
#   - start_bank: 25% of resets from real human mid/late-game positions
#     (late strata put clear-wins a few moves away -> the bonus is
#     discoverable; clean starts never produced one)
#   - BC human-style league seeds + mixed league vs the fixed champion
# Later ladder steps (re-test inside the new metagame): search distillation,
# opponent obs, opponent_model, act_from_search.

algo: ppo_smdp

train:
  total_steps: 2000000000
  checkpoint_interval: 5000000
  init_checkpoint: /Users/ethan/dev/drmario/drmc-rl/runs/best_agents/smdp_ppo_step535164979.pt.gz
  strict_checkpoint: true
  resume_step: false
  resume_optimizer: false

smdp_ppo:
  lr: 7.0e-5
  gamma: 1.0
  gae_lambda: 0.98

  clip_epsilon: 0.15
  value_coef: 0.5
  entropy_coef: 0.008
  max_grad_norm: 0.7

  decisions_per_update: 4096
  num_epochs: 2
  minibatch_size: 512

  policy_type: "candidate"
  head_type: "dense"
  pill_embed_dim: 128
  pill_embed_type: "ordered_pair"
  encoder_blocks: 4

  candidate_max_candidates: 128
  candidate_d_model: 192
  candidate_pos_embed_dim: 32
  candidate_cost_embed_dim: 32
  candidate_hidden_dim: 384
  candidate_board_encoder: "cnn"
  candidate_board_channels: 8
  candidate_transformer_layers: 4
  candidate_transformer_heads: 4
  candidate_transformer_ff_mult: 4
  candidate_patch_kernel: 9

  aux_spec: "v1"

  entropy_schedule_end: 0.008
  entropy_schedule_steps: 100000000
  use_gumbel_topk: false
  gumbel_k: 2

  value_loss_type: "huber"

  # Ladder step 2 candidate (off for vs4_01): Gumbel-AZ distillation,
  # 12-channel phase-1 path (docs/SEARCH_DISTILL.md).
  # search_distill:
  #   enabled: true
  #   sims: 12
  #   beam: 8
  #   decision_fraction: 0.1
  #   beta: 1.0
  #   value_mix: 0.5

env:
  id: "drmario-vs"
  obs_mode: state
  backend: cpp-vs-pool
  state_repr: bitplane_bottle_conn_mask
  num_pairs: 16
  frame_stack: 1
  randomize_rng: true
  level: 14
  speed_setting: 2
  # Bumped 0.25 -> 0.4 (2026-06-12): probe showed the champion gets near-clear
  # boards to 1-3 viruses and STILL camps rather than close (30% clear-win from
  # 5-virus starts; losers die 1 virus from winning). A stronger differential
  # is needed to overcome the topout-aversion. Only reorders win types.
  clear_win_bonus: 0.25
  # SWAPPED to the clear-practice bank (tools/build_clear_practice_bank.py):
  # the human Go-Exploit bank (start_bank_v1) never sits near a clear (median
  # 33-47 viruses; a SAMPLING artifact of build_start_bank, not human play) so
  # the bonus had no gradient (cur=0). clear_practice_v1 = real boards, viruses
  # thinned to 2-8/side -> closing-out reps where the bonus actually fires.
  # Higher fraction (0.35) for frequent endgame practice. Follow-up: extract
  # REAL human clear endgames from the corpus (docs/ABLATION_PLAN.md).
  start_bank:
    enabled: false
    path: runs/start_bank/clear_practice_v1.npz
    fraction: 0.35
  opponent_pool:
    enabled: true
    max_pool: 12
    snapshot_every_matches: 400
    seed_paths:
      - runs/bc_opponents/bc_lt1600.pt.gz
      - runs/bc_opponents/bc_1600to2000.pt.gz
      - runs/bc_opponents/bc_gt2000.pt.gz
    league:
      mode: mixed
      exploiter_fraction: 0.2
      main_agents:
        - runs/best_agents/vs_champion_smdp_ppo_step530046434.pt.gz

curriculum:
  enabled: false

logdir: "runs/vs1p_01"
video_interval: 10000
log_interval: 100
