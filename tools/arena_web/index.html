<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dr. Mario Arena</title><link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div><p class="eyebrow">DRMC · CONTINUOUS ARENA</p><h1>The Bottle League</h1></div>
    <div class="live"><i></i><span>LIVE</span><strong id="games">— games</strong></div></header>
  <main>
    <section class="hero"><div><p>Current champion</p><h2 id="champion">Waiting for roster</h2>
      <span id="champion-meta">The arena will update automatically.</span></div>
      <div class="stamp"><span>LAST UPDATE</span><strong id="updated">—</strong></div></section>
    <section><div class="section-title"><h3>Ratings</h3><p>Bradley–Terry Elo · 95% uncertainty · all eras retained</p></div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Entrant</th><th>Lineage</th><th>Status</th><th>Rating</th><th>95%</th><th>Games</th></tr></thead><tbody id="ratings"></tbody></table></div></section>
    <div class="grid"><section><div class="section-title"><h3>Recent matches</h3></div><div id="matches" class="cards"></div></section>
      <section><div class="section-title"><h3>Lineage events</h3></div><div id="events" class="timeline"></div></section></div>
  </main><script src="/app.js"></script>
</body></html>
