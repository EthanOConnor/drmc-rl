[project]
name = "drmc-rl"
version = "0.1.0"
description = "Dr. Mario RL environment, training, and evaluation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "gymnasium>=1.3,<2",
    "numpy>=2.5.2,<3",
    "rich>=15,<16",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F"]
ignore = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["drmc_rl*", "tools*"]
exclude = [
    "data*",
    "legal_ROMs*",
    "docs*",
    "dr-mario-disassembly*",
]

[tool.setuptools.package-data]
drmc_rl = [
    "game/specs/*.json",
    "envs/libretro/seeds/*.json",
    "planning/cuda/*.cu",
    "training/configs/*.yaml",
]

[project.optional-dependencies]
rl = [
    "tensorboard>=2.21,<3",
    "torch>=2.13,<2.14",
    "wandb>=0.28,<0.29",
]
viz = ["opencv-python-headless>=5,<6", "pillow>=12.3,<13"]
eval = ["matplotlib>=3.11,<4", "pandas>=3.0,<4", "pyarrow>=25,<26"]
corpus = ["pyarrow>=25,<26"]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17"]

[build-system]
requires = ["setuptools>=84,<85", "wheel>=0.48,<0.49"]
build-backend = "setuptools.build_meta"
