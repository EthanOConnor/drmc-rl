[project]
name = "drmc-rl"
version = "0.1.0"
description = "Dr. Mario RL environment, training, and evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "gymnasium",
    "numpy>=2.2,<3; python_version < '3.11'",
    "numpy>=2.4,<3; python_version >= '3.11'",
    "rich>=13.0", # TUI and progress bars
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F"]
ignore = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["drmc_rl*", "tools*"]
exclude = [
    "data*",
    "legal_ROMs*",
    "docs*",
    "dr-mario-disassembly*",
]

[tool.setuptools.package-data]
drmc_rl = [
    "game/specs/*.json",
    "envs/libretro/seeds/*.json",
    "planning/cuda/*.cu",
    "training/configs/*.yaml",
]

[project.optional-dependencies]
rl = [
    "torch",
    "torchvision",
    "torchaudio",
    "torchrl",
    "wandb",          # Experiment tracking (free tier available)
]
viz = ["opencv-python>=4.13.0.92", "pillow"]
dev = ["black", "ruff", "pytest", "pandas", "pyarrow", "matplotlib"]

[build-system]
requires = ["setuptools>=80", "wheel>=0.45"]
build-backend = "setuptools.build_meta"
