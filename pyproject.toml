[project]
name = "drmc-rl"
version = "0.1.0"
description = "Dr. Mario RL environment, training, and evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "gymnasium",
    "numpy>=2.2,<3; python_version < '3.11'",
    "numpy>=2.4,<3; python_version >= '3.11'",
    "rich>=13.0", # TUI and progress bars
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.setuptools]
# Explicitly control package discovery to avoid bundling non-packages (e.g., 're', 'retro')

[tool.setuptools.packages.find]
include = ["envs*", "models*", "eval*", "training*", "tools*"]
exclude = [
    "re*",
    "retro*",
    "data*",
    "legal_ROMs*",
    "docs*",
    "dr-mario-disassembly*",
]

[project.optional-dependencies]
rl = [
    "torch",
    "torchvision",
    "torchaudio",
    "torchrl",
    "pettingzoo",
    "wandb",          # Experiment tracking (free tier available)
]
viz = ["opencv-python>=4.13.0.92", "pillow"]
apple = ["mlx"]
dev = ["black", "ruff", "pytest", "pandas", "pyarrow", "matplotlib"]

[build-system]
requires = ["setuptools>=80", "wheel>=0.45"]
build-backend = "setuptools.build_meta"
