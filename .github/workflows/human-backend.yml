name: Human backend

on:
  push:
    tags: ['human-backend-v*']
  workflow_dispatch:
    inputs:
      model_release:
        description: Release tag containing the V3 human and competitive policies
        required: true
      model_asset:
        description: Checkpoint asset name in the model release
        required: true
        default: human_policy.pt.gz
      competitive_asset:
        description: Competitive policy asset in the same model release
        required: true
        default: competitive_policy.pt.gz

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.10'

      - name: Install packaging environment
        run: uv sync --locked --no-dev --group package --extra inference

      - name: Resolve model identity
        id: model
        shell: bash
        env:
          INPUT_RELEASE: ${{ inputs.model_release }}
          INPUT_ASSET: ${{ inputs.model_asset }}
          INPUT_COMPETITIVE: ${{ inputs.competitive_asset }}
          DEFAULT_RELEASE: ${{ vars.DRMC_HUMAN_POLICY_RELEASE }}
          DEFAULT_ASSET: ${{ vars.DRMC_HUMAN_POLICY_ASSET }}
          DEFAULT_COMPETITIVE: ${{ vars.DRMC_COMPETITIVE_POLICY_ASSET }}
        run: |
          release="${INPUT_RELEASE:-${DEFAULT_RELEASE}}"
          asset="${INPUT_ASSET:-${DEFAULT_ASSET:-human_policy.pt.gz}}"
          competitive="${INPUT_COMPETITIVE:-${DEFAULT_COMPETITIVE:-competitive_policy.pt.gz}}"
          test -n "$release" || { echo 'Set DRMC_HUMAN_POLICY_RELEASE to a published model release containing both policies.' >&2; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "competitive=$competitive" >> "$GITHUB_OUTPUT"

      - name: Fetch published policies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_RELEASE: ${{ steps.model.outputs.release }}
          HUMAN_ASSET: ${{ steps.model.outputs.asset }}
          COMPETITIVE_ASSET: ${{ steps.model.outputs.competitive }}
        run: |
          gh release download "$MODEL_RELEASE" --pattern "$HUMAN_ASSET" --pattern "$COMPETITIVE_ASSET" --dir model

      - name: Build standalone backend
        shell: bash
        env:
          HUMAN_ASSET: ${{ steps.model.outputs.asset }}
          COMPETITIVE_ASSET: ${{ steps.model.outputs.competitive }}
        run: |
          uv run --no-sync python -m tools.package_human_backend --checkpoint "model/$HUMAN_ASSET" --competitive-checkpoint "model/$COMPETITIVE_ASSET"

      - name: Archive backend
        if: runner.os != 'Windows'
        run: tar -czf drmc-human-backend-${{ matrix.platform }}.tar.gz -C dist drmc-human-backend

      - name: Archive backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\drmc-human-backend -DestinationPath drmc-human-backend-${{ matrix.platform }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: drmc-human-backend-${{ matrix.platform }}
          path: drmc-human-backend-${{ matrix.platform }}.*
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/human-backend-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/drmc-human-backend-*
          generate_release_notes: true
