name: Human backend

on:
  push:
    tags: ['human-backend-v*']
  workflow_dispatch:
    inputs:
      model_release:
        description: Release tag containing the calibrated V3 human policy
        required: true
        default: human-policy-v3
      model_asset:
        description: Checkpoint asset name in the model release
        required: true
        default: human_afterstate_v3.pt.gz

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-14
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Install packaging environment
        run: uv sync --group package

      - name: Install CPU-only PyTorch (Linux)
        if: runner.os == 'Linux'
        run: uv pip install 'torch>=2.13,<2.14' --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyTorch
        if: runner.os != 'Linux'
        run: uv sync --group package --extra rl

      - name: Resolve model identity
        id: model
        shell: bash
        env:
          INPUT_RELEASE: ${{ inputs.model_release }}
          INPUT_ASSET: ${{ inputs.model_asset }}
          DEFAULT_RELEASE: ${{ vars.DRMC_HUMAN_POLICY_RELEASE }}
          DEFAULT_ASSET: ${{ vars.DRMC_HUMAN_POLICY_ASSET }}
        run: |
          release="${INPUT_RELEASE:-${DEFAULT_RELEASE:-human-policy-v3}}"
          asset="${INPUT_ASSET:-${DEFAULT_ASSET:-human_afterstate_v3.pt.gz}}"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Fetch published calibrated policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download '${{ steps.model.outputs.release }}'
          --pattern '${{ steps.model.outputs.asset }}' --dir model

      - name: Build standalone backend
        shell: bash
        run: >-
          uv run --no-sync python -m tools.package_human_backend
          --checkpoint 'model/${{ steps.model.outputs.asset }}'

      - name: Archive backend
        if: runner.os != 'Windows'
        run: tar -czf drmc-human-backend-${{ matrix.platform }}.tar.gz -C dist drmc-human-backend

      - name: Archive backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\drmc-human-backend -DestinationPath drmc-human-backend-${{ matrix.platform }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: drmc-human-backend-${{ matrix.platform }}
          path: drmc-human-backend-${{ matrix.platform }}.*
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/human-backend-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/drmc-human-backend-*
          generate_release_notes: true
