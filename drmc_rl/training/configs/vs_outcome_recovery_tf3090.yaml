# Fast on-policy recovery run for the central player. Human imitation is a
# bootstrap/opponent source, never the strength mechanism. Promotion is based
# on full-game outcomes against frozen lineage and humans.
algo: ppo_smdp

train:
  total_steps: 500000000
  checkpoint_interval: 10000000
  checkpoint_keep_last: 10
  init_checkpoint: runs/best_agents/searchlight_g2_vsobs.pt.gz
  strict_checkpoint: true
  resume_step: false
  resume_optimizer: false

smdp_ppo:
  lr: 3.0e-5
  gamma: 1.0
  gae_lambda: 0.98
  clip_epsilon: 0.15
  value_coef: 0.6
  entropy_coef: 0.004
  entropy_schedule_end: 0.001
  entropy_schedule_steps: 200000000
  max_grad_norm: 0.7
  decisions_per_update: 12288
  num_epochs: 2
  minibatch_size: 1536
  compile_mode: default
  rollout_compute_dtype: fp32
  update_compute_dtype: bf16
  policy_type: candidate
  head_type: dense
  pill_embed_dim: 128
  pill_embed_type: ordered_pair
  encoder_blocks: 4
  candidate_max_candidates: 128
  candidate_d_model: 192
  candidate_pos_embed_dim: 32
  candidate_cost_embed_dim: 32
  candidate_hidden_dim: 384
  candidate_board_encoder: cnn
  candidate_board_channels: 16
  candidate_transformer_layers: 4
  candidate_transformer_heads: 4
  candidate_transformer_ff_mult: 4
  candidate_patch_kernel: 9
  aux_spec: v1_vs
  value_loss_type: huber

env:
  id: drmario-vs
  obs_mode: state
  backend: cpp-vs-pool
  gpu_planner: true
  direct_policy_batch: true
  state_repr: bitplane_bottle_conn_mask_vs
  num_pairs: 320
  frame_stack: 1
  randomize_rng: true
  level: 14
  speed_setting: 2
  # Outcome remains dominant. Small dense terms shorten credit assignment but
  # cannot compensate for losing or failing to clear.
  garbage_reward_coef: 0.02
  clear_win_bonus: 0.50
  virus_progress_reward_coef: 0.005
  decision_penalty: 0.0001
  match_horizon_pills: 500
  horizon_penalty: 0.25
  start_bank:
    enabled: true
    path: runs/start_bank/clear_endgame_v1.npz
    fraction: 0.35
  opponent_pool:
    enabled: true
    max_pool: 24
    snapshot_every_matches: 400
    snapshot_gate:
      enabled: true
      min_match_len_sec: 30
      league_wr_frac: 0.50
    device: auto
    # These are distinct corpus-trained policies, not requested-rating clones.
    seed_paths:
      - runs/bc_opponents/bc_lt1600.pt.gz
      - runs/bc_opponents/bc_1600to2000.pt.gz
      - runs/bc_opponents/bc_gt2000.pt.gz
      - runs/best_agents/searchlight_g2_vsobs.pt.gz
    league:
      mode: mixed
      exploiter_fraction: 0.30
      main_agents:
        - runs/best_agents/searchlight_g2_vsobs.pt.gz

curriculum:
  enabled: false

logdir: runs/vs_outcome_recovery_01
