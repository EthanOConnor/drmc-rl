# First G5 competitive-policy run. This deliberately enables all structural
# features supported by the hot placement path; tournament ablations remove
# one feature family at a time after the early checkpoints establish a scale.
algo: ppo_smdp

train:
  total_steps: 250000000
  checkpoint_interval: 1000000
  checkpoint_keep_last: 12
  strict_checkpoint: true
  resume_step: false
  resume_optimizer: false

smdp_ppo:
  lr: 3.0e-5
  gamma: 1.0
  gae_lambda: 0.98
  clip_epsilon: 0.15
  value_coef: 0.6
  entropy_coef: 0.006
  entropy_schedule_end: 0.001
  entropy_schedule_steps: 100000000
  max_grad_norm: 0.7
  decisions_per_update: 12800
  num_epochs: 2
  minibatch_size: 800
  compile_mode: default
  rollout_compute_dtype: bf16
  update_compute_dtype: bf16
  policy_type: candidate
  candidate_architecture: g5
  pill_embed_dim: 160
  pill_embed_type: ordered_pair
  encoder_blocks: 8
  candidate_max_candidates: 128
  candidate_d_model: 320
  candidate_pos_embed_dim: 32
  candidate_cost_embed_dim: 32
  candidate_hidden_dim: 768
  candidate_board_channels: 16
  candidate_transformer_heads: 8
  candidate_transformer_ff_mult: 4
  candidate_patch_kernel: 9
  candidate_cross_layers: 3
  candidate_cross_ff_mult: 4
  candidate_interaction_layers: 2
  candidate_value_atoms: 51
  candidate_conditioned_trunk: true
  candidate_opponent_features: true
  candidate_bottle_block: dense
  candidate_compact_features: false
  aux_spec: v1_vs
  value_loss_type: huber
  teacher_distill:
    enabled: true
    checkpoint: runs/best_agents/outcome_hardening_g4_step1500287362.pt.gz
    beta: 2.0
    value_mix: 0.5
    beta_final: 0.0
    value_mix_final: 0.0
    anneal_start_step: 10000000
    anneal_end_step: 50000000
    temperature: 1.0

env:
  id: drmario-vs
  obs_mode: state
  backend: cpp-vs-pool
  gpu_planner: true
  direct_policy_batch: true
  state_repr: bitplane_bottle_conn_mask_vs
  # 200 pairs divides decisions_per_update exactly (64 policy waves).
  num_pairs: 200
  frame_stack: 1
  randomize_rng: true
  level: 14
  speed_setting: 2
  garbage_reward_coef: 0.01
  clear_win_bonus: 0.35
  virus_progress_reward_coef: 0.003
  decision_penalty: 0.0001
  match_horizon_pills: 500
  horizon_penalty: 0.25
  start_bank:
    enabled: true
    path: runs/start_bank/clear_endgame_v1.npz
    fraction: 0.20
  opponent_pool:
    enabled: true
    max_pool: 32
    snapshot_every_matches: 400
    snapshot_gate:
      enabled: true
      min_match_len_sec: 30
      league_wr_frac: 0.50
    device: auto
    seed_paths:
      - runs/best_agents/outcome_hardening_g4_step1500287362.pt.gz
      - runs/best_agents/outcome_hardening_g4_step1400754599.pt.gz
      - runs/bc_opponents/bc_lt1600.pt.gz
      - runs/bc_opponents/bc_1600to2000.pt.gz
      - runs/bc_opponents/bc_gt2000.pt.gz
    league:
      mode: mixed
      exploiter_fraction: 0.50
      main_agents:
        - runs/best_agents/outcome_hardening_g4_step1500287362.pt.gz
        - runs/best_agents/outcome_hardening_g4_step1400754599.pt.gz
        - runs/bc_opponents/bc_lt1600.pt.gz
        - runs/bc_opponents/bc_gt2000.pt.gz

curriculum:
  enabled: false

logdir: runs/vs_g5_maximal_01
