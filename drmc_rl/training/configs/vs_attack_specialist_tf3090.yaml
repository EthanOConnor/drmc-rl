# Attack-conversion specialist. Rewards garbage only when the receiver releases
# the volley into its field, not when a combo is merely formed.
algo: ppo_smdp
train:
  total_steps: 500000000
  checkpoint_interval: 10000000
  checkpoint_keep_last: 8
  init_checkpoint: runs/vsdist_02/checkpoints/smdp_ppo_step880175540.pt.gz
  strict_checkpoint: true
  resume_step: false
  resume_optimizer: false
smdp_ppo:
  lr: 3.5e-5
  gamma: 1.0
  gae_lambda: 0.98
  clip_epsilon: 0.15
  value_coef: 0.5
  entropy_coef: 0.008
  max_grad_norm: 0.7
  decisions_per_update: 12288
  num_epochs: 2
  minibatch_size: 1536
  compile_mode: default
  rollout_compute_dtype: fp32
  update_compute_dtype: bf16
  policy_type: candidate
  head_type: dense
  pill_embed_dim: 128
  pill_embed_type: ordered_pair
  encoder_blocks: 4
  candidate_max_candidates: 128
  candidate_d_model: 192
  candidate_pos_embed_dim: 32
  candidate_cost_embed_dim: 32
  candidate_hidden_dim: 384
  candidate_board_encoder: cnn
  candidate_board_channels: 8
  candidate_transformer_layers: 4
  candidate_transformer_heads: 4
  candidate_transformer_ff_mult: 4
  candidate_patch_kernel: 9
  aux_spec: v1
  entropy_schedule_end: 0.008
  entropy_schedule_steps: 100000000
  value_loss_type: huber
env:
  id: drmario-vs
  obs_mode: state
  backend: cpp-vs-pool
  gpu_planner: true
  direct_policy_batch: true
  state_repr: bitplane_bottle_conn_mask
  num_pairs: 384
  frame_stack: 1
  randomize_rng: true
  level: 14
  speed_setting: 2
  garbage_reward_coef: 0.12
  clear_win_bonus: 0.15
  virus_progress_reward_coef: 0.01
  decision_penalty: 0.0005
  match_horizon_pills: 420
  horizon_penalty: 0.25
  start_bank:
    enabled: true
    path: runs/start_bank/clear_endgame_v1.npz
    fraction: 0.10
  opponent_pool:
    enabled: true
    max_pool: 16
    snapshot_every_matches: 400
    snapshot_gate:
      enabled: true
      min_match_len_sec: 30
      league_wr_frac: 0.5
    device: auto
    seed_paths:
      - runs/bc_opponents/bc_lt1600.pt.gz
      - runs/bc_opponents/bc_1600to2000.pt.gz
      - runs/bc_opponents/bc_gt2000.pt.gz
      - runs/best_agents/vs4_best_step20188116.pt.gz
    league:
      mode: mixed
      exploiter_fraction: 0.35
      main_agents:
        - runs/vsdist_02/checkpoints/smdp_ppo_step880175540.pt.gz
curriculum:
  enabled: false
logdir: runs/vs_attack_specialist_01
