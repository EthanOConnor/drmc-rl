# vsdist rev B: GPU-powered search distillation on tf3090 (design review R8).
#
# STAGED, DO NOT LAUNCH until the vs6_tf metagame gate passes
# (sustained clear-win rate > 0, BC-band gate, and an anchored tournament
# against best-535m). Then set init_checkpoint to the gated
# best checkpoint of the vs6_tf run and launch as its own SPRT-gated step.
#
# vs the Mac-era vsdist_distill.yaml: sims/fraction raised (search planning
# now runs on reach_cuda — smdp_ppo.search_distill.gpu_planner: true — so the
# CPU BFS is no longer the budget), init/league paths are local, and the env
# block matches vs6_tf3090 (32 pairs, gpu_planner rollouts, retention).

algo: ppo_smdp

train:
  total_steps: 2000000000
  checkpoint_interval: 25000000
  checkpoint_keep_last: 6
  init_checkpoint: REPLACE_WITH_VS6TF_GATED_BEST
  strict_checkpoint: true
  resume_step: false
  resume_optimizer: false

smdp_ppo:
  lr: 3.5e-5
  gamma: 1.0
  gae_lambda: 0.98

  clip_epsilon: 0.15
  value_coef: 0.5
  entropy_coef: 0.008
  max_grad_norm: 0.7

  decisions_per_update: 4096
  num_epochs: 2
  minibatch_size: 512

  policy_type: "candidate"
  head_type: "dense"
  pill_embed_dim: 128
  pill_embed_type: "ordered_pair"
  encoder_blocks: 4

  candidate_max_candidates: 128
  candidate_d_model: 192
  candidate_pos_embed_dim: 32
  candidate_cost_embed_dim: 32
  candidate_hidden_dim: 384
  candidate_board_encoder: "cnn"
  candidate_board_channels: 8
  candidate_transformer_layers: 4
  candidate_transformer_heads: 4
  candidate_transformer_ff_mult: 4
  candidate_patch_kernel: 9

  aux_spec: "v1"

  entropy_schedule_end: 0.008
  entropy_schedule_steps: 100000000
  use_gumbel_topk: false
  gumbel_k: 2

  value_loss_type: "huber"

  search_distill:
    enabled: true
    gpu_planner: true
    sims: 24
    beam: 8
    decision_fraction: 0.25
    beta: 1.0
    value_mix: 0.5

env:
  id: "drmario-vs"
  obs_mode: state
  backend: cpp-vs-pool
  state_repr: bitplane_bottle_conn_mask
  num_pairs: 32
  gpu_planner: true
  frame_stack: 1
  randomize_rng: true
  level: 14
  speed_setting: 2
  clear_win_bonus: 0.25
  start_bank:
    enabled: true
    path: runs/start_bank/clear_endgame_v1.npz
    fraction: 0.35
  opponent_pool:
    enabled: true
    max_pool: 12
    snapshot_every_matches: 400
    seed_paths:
      - runs/bc_opponents/bc_lt1600.pt.gz
      - runs/bc_opponents/bc_1600to2000.pt.gz
      - runs/bc_opponents/bc_gt2000.pt.gz
    league:
      mode: mixed
      exploiter_fraction: 0.2
      main_agents:
        - runs/best_agents/smdp_ppo_step535164979.pt.gz

curriculum:
  enabled: false

logdir: runs/vsdist2_tf
