# vs6 adapted for tf3090 (Linux/CUDA standup, 2026-07-02).
#
# Same design as vs6_stabilized; differences are purely operational:
#   - init_checkpoint / league main_agents: the Mac-only vs1p_gatebest and
#     vs_champion_step530046434 checkpoints are not on this box. Warm-start
#     and league-anchor on the 1P champion best-535m (the same net
#     vs_opponents.CHAMPION_CHECKPOINT points at), which is staged here.
#   - checkpoint_interval raised 5M -> 25M and checkpoint_keep_last: 6
#     (retention pruning) — disk on this box is 94% full.
#   - start_bank: REAL clear-endgame bank (built 2026-07-02 from the local
#     corpus (tools/build_start_bank.py + build_clear_practice_bank.py; the
#     full 29k-quark corpus is at ../fightcadeRatings).

algo: ppo_smdp

train:
  total_steps: 2000000000
  checkpoint_interval: 25000000
  checkpoint_keep_last: 6
  init_checkpoint: runs/best_agents/smdp_ppo_step535164979.pt.gz
  strict_checkpoint: true
  resume_step: false
  resume_optimizer: false

smdp_ppo:
  lr: 3.5e-5
  gamma: 1.0
  gae_lambda: 0.98

  clip_epsilon: 0.15
  value_coef: 0.5
  entropy_coef: 0.008
  max_grad_norm: 0.7

  # 384 pairs x 32 decisions/env. This preserves useful GAE horizon while
  # feeding the 3090 efficiently; 4,096 decisions cut the horizon to ~11.
  decisions_per_update: 12288
  num_epochs: 2
  minibatch_size: 1536
  compile_mode: "default"
  # Collect the next rollout on a one-update-lag actor while PPO updates.
  overlap_rollout_update: true

  policy_type: "candidate"
  head_type: "dense"
  pill_embed_dim: 128
  pill_embed_type: "ordered_pair"
  encoder_blocks: 4

  candidate_max_candidates: 128
  candidate_d_model: 192
  candidate_pos_embed_dim: 32
  candidate_cost_embed_dim: 32
  candidate_hidden_dim: 384
  candidate_board_encoder: "cnn"
  candidate_board_channels: 8
  candidate_transformer_layers: 4
  candidate_transformer_heads: 4
  candidate_transformer_ff_mult: 4
  candidate_patch_kernel: 9

  aux_spec: "v1"

  entropy_schedule_end: 0.008
  entropy_schedule_steps: 100000000
  use_gumbel_topk: false
  gumbel_k: 2

  value_loss_type: "huber"

env:
  id: "drmario-vs"
  obs_mode: state
  backend: cpp-vs-pool
  # Rollout reachability is solved in one GPU batch per decision wave and is
  # bit-exact vs the in-pool CPU planner (tests/test_vs_gpu_planner.py).
  gpu_planner: true
  state_repr: bitplane_bottle_conn_mask
  # Measured tf3090 peak: 384 pairs. 512 no longer improved frame throughput.
  num_pairs: 384
  frame_stack: 1
  randomize_rng: true
  level: 14
  speed_setting: 2
  clear_win_bonus: 0.25
  # REAL human clear-endgame positions (R4): 40k rows / 20k games, both
  # side-mirrors, strata 1-2/3-5/6-8 closer-side viruses. This is what gives
  # clear_win_bonus a gradient (docs/ABLATION_PLAN.md "Correction").
  start_bank:
    enabled: true
    path: runs/start_bank/clear_endgame_v1.npz
    fraction: 0.35
  opponent_pool:
    enabled: true
    max_pool: 12
    snapshot_every_matches: 400
    # Gate-best protection: collapsed policies (short-match equilibrium /
    # anchor-wr collapse) cannot enter the pool — breaks the self-poisoning
    # spiral that killed vs6tf_03 at ~145M steps.
    snapshot_gate:
      enabled: true
      min_match_len_sec: 60
      league_wr_frac: 0.5
    device: auto
    # Full-corpus BC bands v2 (R10): 750k moves/band, d128, val top1 ~0.53.
    seed_paths:
      - runs/bc_opponents_v2/bc_lt1500.pt.gz
      - runs/bc_opponents_v2/bc_1500to1800.pt.gz
      - runs/bc_opponents_v2/bc_1800to2000.pt.gz
      - runs/bc_opponents_v2/bc_gt2000.pt.gz
    league:
      mode: mixed
      exploiter_fraction: 0.2
      main_agents:
        - runs/best_agents/smdp_ppo_step535164979.pt.gz

curriculum:
  enabled: false

logdir: runs/vs6_tf
