version: 1
name: Unified Dr. Mario player program
authority:
  agent_guidance: AGENTS.md
  design: docs/DESIGN.md
  roadmap: docs/ROADMAP.md
  operations: docs/OPERATIONS.md
  evaluation: docs/EVALUATION.md
  counterfactual_quality: docs/COUNTERFACTUAL_QUALITY_HANDOFF.md
principles:
  - One rating-independent competitive core serves all three products.
  - Public actor state and privileged teacher state are separate contracts.
  - The placement SMDP remains primary until the timing-action gate proves timing material.
  - Search models the asynchronous full pair game and teaches the policy before it controls rollouts.
  - Match outcome is authoritative; tactical quantities are auxiliary, curricular, or lexicographic.
  - Human strength is calibrated competitive regret, not temperature, beam width, or random play.
  - Human-rate claims are tied to published execution profiles and hard script validation.
  - Every promoted artifact carries immutable provenance and gate evidence.
  - Reserve reveals use a public seed posterior; independent one-ninth pill branching is mechanics-only.

gates:
  timing-action-gate:
    status: active
    description: Determine whether any valid delayed lock changes transition state or competitive value enough to require timing as an explicit sub-action.
    evidence_path: runs/program/gates/timing-action-gate.json
    criteria:
      - Stratified full-pair probes compare earliest and delayed valid locks under strict causal advancement.
      - Transition-state divergence, value delta, and uncertainty are reported separately.
      - A documented threshold selects placement-only or hierarchical placement-plus-timing.
  pair-state-v2:
    status: complete
    description: Freeze public actor, privileged teacher, and recurrent public-belief contracts with a hidden-information audit.
    evidence_path: runs/program/gates/pair-state-v2.json
    criteria:
      - PublicPairState contains only visible or deterministically inferable information.
      - Future RNG is never a structured model input; exact restore bytes remain opaque and teacher-only.
      - Golden serialization and no-leak tests pass.
  v3-counterfactual-quality:
    status: staged
    description: Replace human-choice-defined competitive rankings with full-pair counterfactual W/D/L labels for every candidate.
    evidence_path: runs/program/gates/v3-counterfactual-quality.json
    depends_on: [pair-state-v2]
    criteria:
      - Every source state carries the public initial virus bottle plus accumulated reserve-reveal history, and reveal probabilities come from the exact posterior under the declared reset-seed prior, never independent one-ninth mass.
      - A 1024-to-2048-state bank fills declared level, speed, and tactical quotas under a frozen competitive rollout policy.
      - Full root coverage, zero candidate truncation, and zero search-budget exhaustion are verified against the source bank.
      - Aggregate and member-specific Davidson links use equal game weight, grouped cross-fitting, natural draw evidence, and paired game-bootstrap improvement.
      - Every candidate exports all frozen member W/D/L values plus finite utility and Jensen-Shannon disagreement.
      - Opponent-beam 4 converges to beam 8 under the predeclared action, value, and policy thresholds; beam 1 is reported as sensitivity evidence.
      - Counterfactual observed-action W/D/L beats the frozen V3 bootstrap with paired whole-game confidence for Brier and log loss.
      - Candidate regret is reported in calibrated win-logit units.
      - Privileged continuation inputs are declared teacher-only and are not presented as deployable public search.
  g5-bakeoff:
    status: staged
    description: Compare root-only, V3-distilled, exact-effect-token, and recurrent/event-state G5 variants under matched compute and opponents.
    evidence_path: runs/program/gates/g5-bakeoff.json
    depends_on: [pair-state-v2, v3-counterfactual-quality]
    criteria:
      - Common parent, seeds, arena mixture, and compute budget are recorded.
      - Candidate truncation is zero in training and evaluation.
      - Promotion uses paired full-game evidence, not training return.
  joint-event-search:
    status: staged
    description: Validate strict asynchronous pair-event search as an offline policy-improvement teacher.
    evidence_path: runs/program/gates/joint-event-search.json
    depends_on: [pair-state-v2, timing-action-gate]
    criteria:
      - Search advances single-side, simultaneous, deterministic, and chance events causally.
      - Native event observations are independent of host polling and preserve their causal history through branch restore before reveal boundaries are collapsed.
      - Same-weight paired evaluation beats the unsearched policy with confidence.
      - Public-information search does not consume privileged-only fields at deployment.
  psro-population:
    status: staged
    description: Promote through a regularized meta-strategy and explicit best-response roles rather than latest-self Elo alone.
    evidence_path: runs/program/gates/psro-population.json
    depends_on: [g5-bakeoff]
    criteria:
      - Arena payoff graph remains connected and the reported meta-strategy is reproducible.
      - Main, main-exploiter, league-exploiter, and human/execution-exploiter roles are active.
      - Promotion improves mixture value without a catastrophic active-opponent regression.
  human-execution-profile:
    status: blocked
    description: Publish corpus-derived elite operation envelopes and constrained reachability.
    evidence_path: runs/program/gates/human-execution-profile.json
    depends_on: [timing-action-gate]
    criteria:
      - Profiles include reaction, edge interval, burst, overlap, correction, and soft-drop distributions.
      - Every emitted script is replay-valid and satisfies all hard limits.
      - Human-rate evaluation reports profile identity and zero violations.
  trainer-calibration:
    status: blocked
    description: Validate monotone rating, independent style, realistic cadence/form, and pedagogical utility.
    evidence_path: runs/program/gates/trainer-calibration.json
    depends_on: [v3-counterfactual-quality, human-execution-profile]
    criteria:
      - Requested rating and achieved arena strength are monotone across states and styles.
      - Matched-rating outcomes are approximately even on held-out humans.
      - Style remains identifiable after controlling for strength.
      - Regret tails, cadence, burst statistics, and temporal error correlation match held-out humans.

recipes:
  trainer-expressive-study:
    status: active
    stage: 4
    purpose: Run finite verified human sequence extraction and fixed-epoch persistent proposal fitting, without promotion.
    requires_paths: [tools/run_expressive_study.py, '{expressive_study_config}']
    requires_gates: []
    command: [python, -m, tools.run_expressive_study, --config, '{expressive_study_config}']
    produces: [Source and fitting status, separate actual exposure counts and a diagnostic proposal network]
    resources:
      preferred_host: mombox
      accelerator: cpu
  trainer-expressive-sequences:
    status: active
    stage: 4
    purpose: Extract uninterrupted human 2–6-placement constructions with exact own-board transition verification, without inferring preference or competitive value.
    requires_paths: [tools/build_expressive_sequences.py, '{expressive_sequences_config}']
    requires_gates: []
    command: [python, -m, tools.build_expressive_sequences, --config, '{expressive_sequences_config}']
    produces: [Verified construction windows, complete source identities, exclusions and observed geometry]
    resources:
      preferred_host: mombox
      accelerator: cpu
  trainer-expressive-proposer:
    status: active
    stage: 4
    purpose: Train diagnostic persistent human construction proposals on causal own-board inputs with whole-session validation; never override the competitive core or authorize quality sacrifice.
    requires_paths: [tools/fit_expressive_proposer.py, '{expressive_proposer_config}']
    requires_gates: []
    command: [python, -m, tools.fit_expressive_proposer, --config, '{expressive_proposer_config}']
    produces: [Fixed-epoch persistent proposal network, grouped imitation diagnostics and actual supervised exposure]
    resources:
      preferred_host: mombox
      accelerator: cpu
  trainer-public-input-alignment:
    status: active
    stage: 3
    purpose: Align full public controller inputs with frozen parent behavior before outcome learning, using training replay and whole-seed descriptive validation.
    requires_paths: [tools/fit_public_alignment.py, '{public_alignment_config}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.fit_public_alignment, --config, '{public_alignment_config}']
    produces: [Diagnostic aligned public core, complete target support, grouped policy agreement and KL, actual supervised root presentations]
    resources:
      preferred_host: local
      accelerator: mps
    notes:
      - The teacher receives its historical public encoding and canonical frontier; the student retains full public features and every exact feasible orientation.
      - A declared small uniform probability supports every student action. No candidate quality or optimality labels are inferred from parent choices.
      - Use training-only replay, group every shared reset seed across source shards, and retain a fixed final epoch. Validation never selects weights, epochs or learning rates.
      - Count supervised presentations separately from console frames and outcome learner decisions. Substantial controller evaluation remains required before adoption or another training branch.
  trainer-motor-confirmation:
    status: active
    stage: 4
    purpose: Confirm learned motor predictions on fresh reserved-seed controller play, separately from full-game strength evaluation.
    requires_paths: [tools/audit_motor_auxiliary.py, '{motor_confirmation_config}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.audit_motor_auxiliary, --config, '{motor_confirmation_config}']
    produces: [Natural public confirmation replay, complete conditional labels, seed-grouped prediction errors and policy drift]
    resources:
      preferred_host: mombox
      accelerator: cpu
    notes:
      - Reset seeds must be excluded from outcome training, auxiliary fitting and broad policy anchors. No gradients or model selection occur.
      - Compare with the reconstructed original predictor and a pace/cell prevalence baseline fitted only on training labels.
      - Sides, earlier/later roots and parity are dependent observations; uncertainty resamples whole reset seeds within each level/pace.
      - Prediction confirmation does not establish match strength or promote the fitted core.
  trainer-motor-auxiliary-fit:
    status: active
    stage: 4
    purpose: Teach the shared public core exact effects and conditional future access with independent replay anchoring and whole-seed validation.
    requires_paths: [tools/fit_motor_auxiliary.py, '{motor_auxiliary_config}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.fit_motor_auxiliary, --config, '{motor_auxiliary_config}']
    produces: [Diagnostic public core, effect/access/cost errors, train and validation policy drift, measured fit exposure]
    resources:
      preferred_host: tf3090
      accelerator: cuda
    notes:
      - Auxiliary labels do not change match rewards or supply candidate WDL values. Heads are skipped by ordinary inference.
      - Actual own controller geometry conditions the predictor; broad policy anchors exclude validation seeds and labeled decisions.
      - Only training and anchor policy KL govern optimizer rollback; holdout measurements are never optimized against.
      - A fitted core still requires fresh prediction confirmation and substantial controller strength/latency evaluation.
  trainer-motor-opportunity-bank:
    status: active
    stage: 4
    purpose: Generate complete conditional next-known-pill movement and clear targets from exact public controller replay, with whole-seed holdouts.
    requires_paths: [tools/build_motor_opportunity_bank.py, '{motor_opportunity_config}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.build_motor_opportunity_bank, --config, '{motor_opportunity_config}']
    produces: [Exact own-board effects, next-pill frontiers and region maps for both spawn parities, whole-seed train/validation splits]
    resources:
      preferred_host: mombox
      accelerator: cpu
    notes:
      - Inputs require v2 controller replay with observed own DAS, parity, counters and charged delay. Old missing microstates are not fabricated.
      - Every root candidate is retained. Incoming garbage is explicitly excluded and the two spawn parities are separate conditions, not samples.
      - These deterministic geometry labels are auxiliary targets, not counterfactual match values, a style reward, or promotion evidence.
  trainer-controller-core:
    status: active
    stage: 3
    purpose: Train the full competitive core from natural paced controller games with live causal public history and motor inputs.
    requires_paths: [tools/train_pace_strategy.py, '{controller_core_config}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.train_pace_strategy, --config, '{controller_core_config}']
    produces: [Full public core checkpoint, complete natural-game journal, optional public input replay shards, measured episodic update KL and throughput]
    resources:
      preferred_host: tf3090
      accelerator: cuda
    notes:
      - Set training_model to public_core and use the causal frame/event collector. All seven authored paces are supported.
      - Every learner transition stores public model inputs, not frozen trunk features. The whole core receives outcome gradients.
      - The frozen post-migration initial policy is the explicit regularization reference; failed quality labels are excluded.
      - This experiment does not promote a model, calibrate a quality head, or complete the larger-teacher and expressive-play stages.
  search-frontier-benchmark:
    status: active
    stage: 4
    purpose: Measure queued versus recursive neural search on identical complete native roots without claiming calibrated value or strength.
    requires_paths: [tools/benchmark_search_frontiers.py, '{search_frontier_config}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.benchmark_search_frontiers, --config, '{search_frontier_config}']
    produces: [Per-root wall time, actual neural batch counts, full action utilities and parity]
    resources:
      accelerator: cpu
  paired-quality-fit:
    status: staged
    stage: 4
    purpose: Diagnostic critic-only, public-context-only and combined fits from complete paired terminal panels, with whole-game holdout, independent policy anchors and bounded evaluation batches.
    requires_paths: [tools/fit_paired_quality.py, drmc_rl/training/model_growth.py, '{paired_quality_fit_config}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.fit_paired_quality, --config, '{paired_quality_fit_config}']
    produces: [Diagnostic checkpoint, source-game heldout WDL and paired-gap errors, layer update and representation diagnostics]
    resources:
      preferred_host: tf3090
      accelerator: cuda
    notes:
      - Auxiliary and supervised policy-improvement phases are separate from on-policy PPO. All candidate outcomes must be complete.
      - Separate policy-anchor games are mandatory; all source/anchor/confirmation position, game and reset-seed identities must be disjoint.
      - Whole-reset-seed weighting and streamed complete-frontier metrics preserve independent-game denominators. Only training and anchor KL can control optimizer rollback.
      - Initial and final held-out predictions retain per-candidate WDL and policy probabilities for paired whole-game ranking and regret comparisons.
      - Optional dense bottle growth preserves the starting public policy with a fixed token interface. Report bottle width/depth, parameter counts and measured allocation separately.
      - Common split_seed values keep held-out whole games fixed across independent model seeds. Equal data and equal exclusive GPU time require separate measured comparisons.
      - Public-context inputs require the causal observation timeline; historical warped buffers cannot initialize it.
      - This fitting diagnostic does not certify WDL calibration, decision improvement or a product promotion.
  paired-quality-fit-budgeted:
    status: staged
    stage: 4
    purpose: Fit a diagnostic teacher inside a monitored CUDA time allowance, retaining only a complete policy-checked checkpoint stored before cutoff.
    requires_paths: [tools/budgeted_quality_fit.py, tools/fit_paired_quality.py, '{paired_quality_budget_config}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.budgeted_quality_fit, --config, '{paired_quality_budget_config}']
    produces: [Selected diagnostic checkpoint, actual allocation cost and checkpoint age, GPU ownership record, final selected-checkpoint counters]
    resources:
      preferred_host: tf3090
      accelerator: cuda
    notes:
      - All paired-quality-fit data, information-boundary and policy-preservation contracts still apply.
      - A separate watchdog ends the child at its wall-time allowance. Only snapshots stored before the cutoff are eligible, not interrupted optimizer work.
      - Require a full physical GPU UUID, a free GPU at launch, and monitored child ownership. Other compute processes invalidate the allocation comparison and are never killed.
      - Use fast local scratch for two atomic checkpoint versions. Export after child exit; failures retain scratch for recovery.
      - Equal maximum GPU allocation and equal data are separate analyses. Report actual time, unused allowance, overrun and selected-checkpoint age rather than assuming equal consumed compute.
      - These controls do not establish useful quality targets, independent-teacher strength, calibrated WDL or product promotion.
  public-quality-bank:
    status: active
    stage: 4
    purpose: Collect broad complete public source games with batched frozen actors and disjoint fit, policy-anchor and confirmation seed partitions.
    requires_paths: [tools/build_public_quality_bank.py, '{public_quality_bank_config}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.build_public_quality_bank, --config, '{public_quality_bank_config}']
    produces: [Causal public roots with full native restore and reserve history, source-game outcomes, independent partition manifests, measured throughput]
    resources:
      preferred_host: tf3090
      accelerator: cuda
    notes:
      - Native SMDP execution is explicit. Frame-trained history/motor cores require the controller replay collector instead.
      - Cold pairs and a frozen unique reset-seed catalog make games independent of slot reuse. Native round reset otherwise retains cartridge attack-color history.
      - Bounded reservoirs sample opening, middle and late play with tactical coverage and at most one loss predecessor per game.
      - Complete games commit atomically. Resume preserves their identities; capped games remain censored and cannot supply natural labels.
  public-predecessor-bank:
    status: active
    stage: 4
    purpose: Collect exact 14-HI public-core trajectories and full-pair states 4, 8 and 16 own placements before natural losses.
    requires_paths: [tools/build_pair_state_pilot.py, '{competitive_checkpoint}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.build_pair_state_pilot, --public-checkpoint, '{competitive_checkpoint}', --device, '{bank_device}', --level, '14', --speed, '2', --states, '{bank_states}', --states-per-game, '4', --max-decisions-per-game, '2048', --max-games, '128', --failure-predecessors, --output, '{public_predecessor_bank}']
    produces: [Exact pair-state curriculum, public reserve histories, complete natural outcomes and failure offsets]
    resources:
      accelerator: cpu
  paired-terminal-quality:
    status: active
    stage: 4
    purpose: Generate full-root paired natural-terminal outcomes under a named public continuation/opponent panel and the complete public reserve posterior.
    requires_paths: [tools/build_paired_terminal_quality.py, '{paired_terminal_config}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.build_paired_terminal_quality, --config, '{paired_terminal_config}']
    produces: [Paired rollout inventory, candidate WDL, separate chance and continuation sensitivity, bounded policy targets]
    resources:
      preferred_host: tf3090
      accelerator: cuda
    notes:
      - Native SMDP execution is explicit; paced controller continuations require their own tested restore/execution adapter.
      - root_batch_size batches independent complete-root panels; durable per-root inventories permit exact-contract resume without discarding completed roots.
      - Complete-case candidate selection cannot hide censored branches. Missing labels remain unknown and suppress policy targets.
      - This prospective teacher does not open or replace the failed historical v3-counterfactual-quality gate.
  trainer-objective-study:
    status: active
    stage: 3
    purpose: Compare episodic and historical length-normalized actor credit with common initialization, pace exposure and measured categorical update KL.
    requires_paths: [tools/run_pace_objective_study.py, '{trainer_objective_study}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.run_pace_objective_study, --config, '{trainer_objective_study}']
    produces: [Separate bounded training arms, update diagnostics, held-out natural-game evaluation]
    resources:
      preferred_host: tf3090
      accelerator: cuda
    notes:
      - This prospective outcome-only ablation does not open counterfactual-quality, search, calibration or release gates.
      - Actor, value, entropy, parent KL and advantage normalization have separate explicit reductions. Changed objectives require a fresh run, optionally initialized from frozen adapter weights.
  trainer-pace-throughput:
    status: active
    stage: 3
    purpose: Compare causal batched pace rollouts with the frame reference using identical game inputs and measured wall time.
    requires_paths: [tools/benchmark_pace_throughput.py, '{trainer_throughput_config}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.benchmark_pace_throughput, --config, '{trainer_throughput_config}']
    produces: [Throughput measurements, exact trajectory and outcome comparisons]
    resources:
      preferred_host: tf3090
      accelerator: cuda
  trainer-pace-study:
    status: active
    stage: 3
    purpose: Run a bounded pace adapter experiment followed by fixed held-out controller tournaments, without automatic model promotion.
    requires_paths: [tools/run_pace_study.py, '{trainer_pace_study}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.run_pace_study, --config, '{trainer_pace_study}']
    produces: [Pace training checkpoints, independent per-pace tournament results, study status]
    resources:
      preferred_host: tf3090
      accelerator: cuda
  trainer-pace-strategy:
    status: active
    stage: 3
    purpose: Train a public motor-conditioned adapter on the frozen competitive core from natural full-game outcomes under exact paced controller execution.
    requires_paths: [tools/train_pace_strategy.py, '{trainer_pace_config}']
    requires_gates: [pair-state-v2]
    command: [python, -m, tools.train_pace_strategy, --config, '{trainer_pace_config}']
    produces: [Bounded pace adapter checkpoints, natural-terminal training metrics and frozen-parent identity]
    resources:
      preferred_host: tf3090
      accelerator: cuda
    notes:
      - The first adapter trains Sloth through Top Humans; Super Human and Frame Perfect remain exact frozen-parent routes.
      - Full controller frames preserve incoming garbage, reaction, movement and gravity. Gamma is one and only natural terminal outcomes train the adapter.
      - Training results are not evaluation ratings. Disjoint paired-seed games at 14 HI govern selection; 20 HI remains a separate pressure check.
      - This outcome-learning diagnostic does not use failed search labels or open calibration, search-quality or release gates.
  trainer-planning-analysis:
    status: active
    stage: 1
    purpose: Replay completed controller games and measure fresh-opponent sensitivity and moves lost during planning delay.
    requires_paths: [tools/analyze_trainer_planning.py, '{trainer_planning_moves}', '{competitive_checkpoint}']
    requires_gates: []
    command: [python, -m, tools.analyze_trainer_planning, --moves, '{trainer_planning_moves}', --checkpoint, '{competitive_checkpoint}', --output, '{trainer_planning_analysis}']
    produces: [Replayed outcome checks and public-decision sensitivity measurements]
    resources:
      preferred_host: local
      accelerator: mps
  trainer-planning-sync:
    status: active
    stage: 1
    purpose: Keep the local trainer dashboard current from closed remote tournament snapshots.
    requires_paths: [tools/trainer_arena_sync.py, '{trainer_sync_config}']
    requires_gates: []
    command: [python, -m, tools.trainer_arena_sync, --watch-config, '{trainer_sync_config}']
    produces: [Live local tournament results and replay archive]
    resources:
      preferred_host: local
      accelerator: cpu
  trainer-planning-arena:
    status: active
    stage: 1
    purpose: Compare measured compute budgets and anticipatory trainer execution in side-balanced round robins with actual controller inputs, primarily at level 14 HI.
    requires_paths:
      - tools/trainer_planning_arena.py
      - '{trainer_arena_config}'
    requires_gates: []
    command: [python, -m, tools.trainer_planning_arena, --config, '{trainer_arena_config}']
    produces:
      - Paired WDL, exact input validation, preparation hit rates, match replays and move traces
    resources:
      preferred_host: tf3090
      accelerator: cuda
  trainer-planning-latency:
    status: active
    stage: 1
    purpose: Measure the installed competitive policy, exact planning, and batched conditional previews on public positions before selecting execution delays.
    requires_paths:
      - tools/benchmark_trainer_planning.py
      - '{competitive_checkpoint}'
      - '{trainer_control_checkpoint}'
      - '{trainer_planning_roots}'
    requires_gates: []
    command:
      - python
      - -m
      - tools.benchmark_trainer_planning
      - --checkpoint
      - '{competitive_checkpoint}'
      - --human-checkpoint
      - '{trainer_control_checkpoint}'
      - --roots
      - '{trainer_planning_roots}'
      - --output
      - '{trainer_planning_report}'
    produces:
      - On-device stage latencies and conditional-preview batch comparisons
    resources:
      preferred_host: local
      accelerator: mps
  trainer-experiment-dashboard:
    status: active
    stage: 1
    purpose: Serve the local trainer experiment plan, tournament progress, and recorded games without launching training or automatic promotion.
    requires_paths:
      - tools/arena.py
      - '{trainer_experiment}'
    requires_gates: []
    command:
      - python
      - -m
      - tools.arena
      - --db
      - '{arena_db}'
      - serve
      - --experiment-file
      - '{trainer_experiment}'
      - --port
      - '{arena_port}'
      - --no-ratings
    produces:
      - Loopback dashboard with live work status, comparison results, and recorded board playback
    resources:
      preferred_host: local
      accelerator: cpu
  trainer-repertoire-source:
    status: active
    stage: 1
    purpose: Extract a bounded original human VS start bank from the read-only replay archive before repertoire filtering.
    requires_paths:
      - tools/build_start_bank.py
      - '{repertoire_replay_db}'
      - '{repertoire_fcr_root}/store.py'
    requires_gates: []
    command:
      - python3
      - -m
      - tools.build_start_bank
      - --db
      - '{repertoire_replay_db}'
      - --fcr-root
      - '{repertoire_fcr_root}'
      - --out
      - '{trainer_repertoire_source}'
      - --max-quarks
      - '2048'
      - --seed
      - '20260907'
      - --validate
      - '0'
    produces:
      - Unmodified human bottle snapshots and source replay identities for native curriculum validation
    resources:
      preferred_host: mombox
      accelerator: cpu
    notes:
      - Extraction is read-only. Native validation occurs in trainer-repertoire-curriculum before training, not on this data host.
  trainer-repertoire-curriculum:
    status: active
    stage: 1
    purpose: Select reachable horizontal, crossing, large-clear, and cascade opportunities from a human VS start bank for outcome-only curriculum sampling.
    requires_paths:
      - tools/build_repertoire_bank.py
      - '{trainer_repertoire_source}'
    requires_gates: []
    command:
      - python
      - -m
      - tools.build_repertoire_bank
      - --source
      - '{trainer_repertoire_source}'
      - --output-dir
      - '{trainer_repertoire_bank}'
    produces:
      - Game-disjoint training and held-out synthetic reset banks with exact opportunity labels and source hashes
    resources:
      preferred_host: tf3090
      accelerator: cpu
    notes:
      - Resets retain the source bank's asynchronous-board and randomized-future approximations; they are not replay-certified trajectories.
      - Labels select situations only, never action targets or additional reward. Clean-start arena outcomes govern adoption.
  trainer-repertoire-audit:
    status: active
    stage: 1
    purpose: Measure first-clear geometry, exact clear opportunities, and policy sensitivity to live pace costs on fresh public self-play roots; never changes the deployed policy.
    requires_paths:
      - tools/audit_trainer_repertoire.py
      - '{competitive_checkpoint}'
    requires_gates: []
    command:
      - python
      - -m
      - tools.audit_trainer_repertoire
